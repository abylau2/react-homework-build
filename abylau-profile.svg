<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="profileTitle profileDesc">
  <title id="profileTitle">Abylau — Developer Profile Portrait</title>
  <desc id="profileDesc">Minimalist geometric vector portrait of frontend engineer Abylau.</desc>

  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="400" rx="32" fill="url(#avatarBg)" />
  <rect width="398" height="398" x="1" y="1" rx="31" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  <circle cx="200" cy="180" r="140" fill="url(#accentGlow)" />

  <!-- Technical Grid Pattern -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="300" x2="400" y2="300" />
  </g>

  <!-- Developer Silhouette -->
  <!-- Shoulders & Dark Minimalist Crewneck -->
  <path d="M100 380 C105 295 145 260 200 260 C255 260 295 295 300 380 Z" fill="#090d16" />
  <path d="M165 260 C175 275 190 282 200 282 C210 282 225 275 235 260 Z" fill="#1e293b" />

  <!-- Neck -->
  <rect x="180" y="220" width="40" height="45" rx="6" fill="#e2e8f0" />

  <!-- Head & Jawline -->
  <path d="M145 160 C145 105 170 85 200 85 C230 85 255 105 255 160 C255 215 230 235 200 235 C170 235 145 215 145 160 Z" fill="#f1f5f9" />

  <!-- Modern Textured Short Hair -->
  <path d="M140 150 C138 95 165 65 200 65 C235 65 262 95 260 150 C250 135 235 130 215 130 C195 130 185 138 165 130 C150 125 145 140 140 150 Z" fill="#0f172a" />

  <!-- Minimalist Studio Glasses -->
  <g stroke="#0f172a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="156" y="145" width="36" height="24" rx="4" fill="rgba(59, 130, 246, 0.08)" />
    <rect x="208" y="145" width="36" height="24" rx="4" fill="rgba(59, 130, 246, 0.08)" />
    <line x1="192" y1="155" x2="208" y2="155" />
    <!-- Eyes -->
    <circle cx="174" cy="157" r="3.5" fill="#0f172a" />
    <circle cx="226" cy="157" r="3.5" fill="#0f172a" />
  </g>

  <!-- Nose & Smile Line -->
  <path d="M200 172 L198 188 H204" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M188 206 C195 212 205 212 212 206" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />

  <!-- Top Status Pill Tag -->
  <g transform="translate(32, 32)">
    <rect width="90" height="26" rx="13" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <circle cx="14" cy="13" r="3.5" fill="#10b981" />
    <text x="24" y="17" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">DEV // 2026</text>
  </g>

  <!-- Bottom Terminal Tag -->
  <g transform="translate(130, 335)">
    <rect width="140" height="30" rx="8" fill="#0f172a" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1.5" />
    <text x="70" y="19" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">&lt;Abylau /&gt;</text>
  </g>
</svg>
