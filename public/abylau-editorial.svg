<svg width="900" height="1100" viewBox="0 0 900 1100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Abylau at a modern creative development workstation</title>
  <desc id="description">An editorial collage illustration of frontend developer Abylau building responsive React interfaces at his desk.</desc>

  <defs>
    <pattern id="editorial-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#F5F0E5" stroke-width="2" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background Base: Deep Ultramarine Blue with Grid -->
  <rect width="900" height="1100" fill="#1832C7"/>
  <rect width="900" height="1100" fill="url(#editorial-grid)"/>

  <!-- Top Geometric Composition Shapes -->
  <!-- Top Left: Acid Yellow Wireframe Card -->
  <rect x="52" y="64" width="280" height="230" fill="#DFFF52" stroke="#151711" stroke-width="8"/>
  <path d="M78 140H290M78 180H240M78 220H180" stroke="#151711" stroke-width="10" stroke-linecap="round"/>
  <!-- Top Right: Vivid Tangerine Sun / Sphere -->
  <circle cx="700" cy="180" r="115" fill="#FF5722" stroke="#151711" stroke-width="8"/>
  <!-- Decorative Cross / Plus -->
  <path d="M740 370L800 430M800 370L740 430" stroke="#DFFF52" stroke-width="12" stroke-linecap="square"/>

  <!-- Paper Horizon Arc -->
  <path d="M0 520C120 460 280 430 460 440C640 450 780 490 900 450V1100H0V520Z" fill="#F5F0E5" stroke="#151711" stroke-width="8"/>

  <!-- Desk Surface -->
  <path d="M0 860H900V1100H0V860Z" fill="#DFFF52" stroke="#151711" stroke-width="8"/>
  <path d="M60 990H320M60 1025H250" stroke="#151711" stroke-width="10" stroke-linecap="round"/>

  <!-- Developer Figure: Abylau -->
  <!-- Shoulders & Dark Technical Jacket / Hoodie -->
  <path d="M280 860C290 670 380 620 490 620C600 620 690 670 700 860H280Z" fill="#151711" stroke="#151711" stroke-width="8"/>

  <!-- Neck -->
  <rect x="445" y="580" width="90" height="70" fill="#E6A87C" stroke="#151711" stroke-width="8"/>

  <!-- Head / Jaw (Male structure, defined jawline) -->
  <path d="M370 430C370 340 420 300 490 300C560 300 610 340 610 430C610 520 570 590 490 590C410 590 370 520 370 430Z" fill="#E6A87C" stroke="#151711" stroke-width="8"/>

  <!-- Modern Hair (Textured Short Crop / Taper) -->
  <path d="M360 410C355 330 395 250 490 250C585 250 625 330 620 410C605 385 580 375 550 375C520 375 500 390 470 375C435 360 390 375 360 410Z" fill="#151711"/>
  <path d="M355 410C350 350 380 290 440 260C400 290 370 330 365 390L355 410Z" fill="#242720"/>

  <!-- Ears -->
  <ellipse cx="365" cy="460" rx="16" ry="24" fill="#E6A87C" stroke="#151711" stroke-width="7"/>
  <ellipse cx="615" cy="460" rx="16" ry="24" fill="#E6A87C" stroke="#151711" stroke-width="7"/>

  <!-- Eyes & Eyebrows (Focused & Calm) -->
  <rect x="415" y="420" width="40" height="8" rx="4" fill="#151711"/>
  <rect x="525" y="420" width="40" height="8" rx="4" fill="#151711"/>
  <circle cx="435" cy="455" r="9" fill="#151711"/>
  <circle cx="545" cy="455" r="9" fill="#151711"/>

  <!-- Nose & Confident Slight Smile -->
  <path d="M490 445L485 490H500" stroke="#151711" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M460 525C478 540 502 540 520 525" stroke="#151711" stroke-width="7" stroke-linecap="round"/>

  <!-- Workstation Tech Gear -->
  <!-- Laptop / Code Monitor on Stand -->
  <g transform="rotate(3 550 780)">
    <!-- Monitor Back / Stand -->
    <rect x="420" y="660" width="340" height="230" rx="14" fill="#F5F0E5" stroke="#151711" stroke-width="8"/>
    <!-- Screen Bezel -->
    <rect x="440" y="680" width="300" height="190" rx="8" fill="#1832C7" stroke="#151711" stroke-width="6"/>
    <!-- Code Editor UI Mockup on Screen -->
    <rect x="455" y="695" width="60" height="12" rx="4" fill="#DFFF52"/>
    <path d="M455 725H680M455 750H620M475 775H700M475 800H580M455 825H650" stroke="#F5F0E5" stroke-width="8" stroke-linecap="round"/>
    <circle cx="715" cy="705" r="6" fill="#FF5722"/>
  </g>

  <!-- Laptop Base / Keyboard -->
  <polygon points="340,880 780,880 740,940 380,940" fill="#151711" stroke="#151711" stroke-width="8"/>

  <!-- Floating React Stamp Badge -->
  <g transform="translate(680, 890)">
    <circle cx="65" cy="65" r="65" fill="#FF5722" stroke="#151711" stroke-width="8"/>
    <text x="65" y="74" fill="#F5F0E5" font-family="'Space Mono', monospace, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="1">REACT</text>
  </g>
</svg>
